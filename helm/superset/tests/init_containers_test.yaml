suite: init containers + extraInitContainers
templates:
  - deployment.yaml
  - deployment-worker.yaml
  - deployment-beat.yaml
  - deployment-flower.yaml
  - deployment-ws.yaml
  - deployment-mcp.yaml
  - init-job.yaml
tests:
  - it: renders only the default wait-for container by default
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres

  - it: appends extraInitContainers after the default initContainers
    template: deployment.yaml
    set:
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
          command: ["sh", "-c", "echo preparing"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: templates values inside extraInitContainers
    template: deployment.yaml
    set:
      image.repository: example/superset
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: "{{ .Values.image.repository }}:test"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: example/superset:test

  - it: keeps replace semantics for initContainers while appending extras
    template: deployment.yaml
    set:
      supersetNode.initContainers:
        - name: custom-wait
          image: busybox
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: custom-wait
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: renders only extras when initContainers is cleared
    template: deployment.yaml
    set:
      supersetNode.initContainers: []
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prepare-assets

  - it: appends worker extraInitContainers after wait-for-postgres-redis
    template: deployment-worker.yaml
    set:
      supersetWorker.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends beat extraInitContainers after wait-for-postgres-redis
    template: deployment-beat.yaml
    set:
      supersetCeleryBeat.enabled: true
      supersetCeleryBeat.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends flower extraInitContainers after wait-for-postgres-redis
    template: deployment-flower.yaml
    set:
      supersetCeleryFlower.enabled: true
      supersetCeleryFlower.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends websockets extraInitContainers after wait-for-redis
    template: deployment-ws.yaml
    set:
      supersetWebsockets.enabled: true
      supersetWebsockets.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends mcp extraInitContainers after wait-for-postgres-redis
    template: deployment-mcp.yaml
    set:
      supersetMcp.enabled: true
      supersetMcp.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres-redis
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: appends init job extraInitContainers after wait-for-postgres
    template: init-job.yaml
    set:
      init.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-assets

  - it: leaves init containers alone when no pod environment is configured
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[0].env
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env

  - it: loads envFromSecrets in init containers, after the chart managed secret
    template: deployment.yaml
    set:
      envFromSecrets:
        - my-database-secret
        - '{{ .Release.Name }}-templated-secret'
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-superset-env
            - secretRef:
                name: my-database-secret
            - secretRef:
                name: RELEASE-NAME-templated-secret

  - it: passes extraEnv and extraEnvRaw to init containers
    template: deployment.yaml
    set:
      extraEnv:
        GUNICORN_TIMEOUT: 300
      extraEnvRaw:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: my-database-secret
              key: password
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: GUNICORN_TIMEOUT
              value: "300"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: my-database-secret
                  key: password

  - it: passes the pod environment to extraInitContainers too
    template: deployment.yaml
    set:
      envFromSecrets:
        - my-database-secret
      supersetNode.extraInitContainers:
        - name: prepare-assets
          image: busybox
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].envFrom
          value:
            - secretRef:
                name: my-database-secret

  - it: passes the pod environment to the worker init containers
    template: deployment-worker.yaml
    set:
      envFromSecrets:
        - my-database-secret
      extraEnvRaw:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-database-secret
              key: host
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: my-database-secret
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: my-database-secret
                key: host

  - it: passes the pod environment to the init job wait-for-postgres container
    template: init-job.yaml
    set:
      envFromSecrets:
        - my-database-secret
      extraEnvRaw:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-database-secret
              key: host
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].envFrom
          content:
            secretRef:
              name: my-database-secret
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: my-database-secret
                key: host
